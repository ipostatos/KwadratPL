name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:   # ручной запуск (напр. проверить деплой без пустого коммита)

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install deps
        run: pip install -r backend/requirements-dev.txt
      - name: Run pytest
        working-directory: backend
        run: pytest

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Syntax-check webapp JS
        run: |
          for f in webapp/js/core.js webapp/js/subs.js webapp/js/price.js webapp/js/ai.js webapp/i18n.dict.js webapp/icons.js webapp/i18n.js webapp/guide.js webapp/nav.js; do
            node --check "$f"
          done
      - name: Check i18n dictionary + icons integrity
        run: node webapp/_test/check-i18n.mjs
      - name: Smoke-test App modules (js/core+subs+price+ai)
        run: node webapp/_test/check-app.mjs
      - name: Build landing (generator must not throw)
        run: node site/_build/generate.mjs

  deploy:
    name: Deploy to VPS
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect deploy-relevant changes
        id: changes
        run: |
          BEFORE="${{ github.event.before }}"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BEFORE" 2>/dev/null; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$BEFORE" "${{ github.sha }}" | grep -qE '^(webapp/|backend/|tools/)'; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Setup SSH
        if: steps.changes.outputs.relevant == 'true'
        env:
          KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS: ${{ secrets.VPS_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${VPS#*@}" >> ~/.ssh/known_hosts 2>/dev/null
      - name: Deploy webapp + backend + tools, restart service
        if: steps.changes.outputs.relevant == 'true'
        env:
          VPS: ${{ secrets.VPS_HOST }}
        run: |
          SSH="ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes"
          # rsync --delete вместо scp: scp никогда не удаляет файлы на VPS, поэтому
          # файл, удалённый/переименованный в репо, оставался сиротой на проде.
          # webapp/data/listings.json НЕ трогаем — прод-данные обновляет фетчер через
          # /api/listings; commute.json — статика (районный контекст), синкается сам.
          # --chown=kwadratpl:kwadratpl ОБЯЗАТЕЛЕН: без него rsync -a preserves
          # owner/group С РАННЕРА (чужой uid) и на ВЕСЬ синкнутый пул файлов —
          # включая уже существующие — что один раз уже уронило запись в
          # webapp/data/ сервисом kwadratpl (PermissionError), т.к. scp раньше
          # так не делал (перезаписывал контент, не трогая владельца).
          rsync -a --chown=kwadratpl:kwadratpl --delete -e "$SSH" --exclude='_test/' --exclude='data/listings.json' webapp/ "$VPS:/opt/kwadratpl/webapp/"
          rsync -a --chown=kwadratpl:kwadratpl --delete -e "$SSH" --exclude='tests/' --exclude='state.db*' --exclude='.venv/' --exclude='__pycache__/' backend/ "$VPS:/opt/kwadratpl/backend/"
          rsync -a --chown=kwadratpl:kwadratpl --delete -e "$SSH" tools/ "$VPS:/opt/kwadratpl/tools/"
          $SSH "$VPS" "systemctl restart kwadratpl-api && sleep 2 && systemctl is-active kwadratpl-api"
