name: olx-access-test
on: workflow_dispatch

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe OLX public API
        run: |
          code=$(curl -s -o /tmp/resp.json -w "%{http_code}" \
            -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/126.0 Safari/537.36" \
            "https://www.olx.pl/api/v1/offers/?category_id=15&city_id=17871&limit=2")
          echo "HTTP $code"
          head -c 200 /tmp/resp.json; echo
          test "$code" = "200"
