<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Подписки — Kwadrat PL</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="theme.css">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="nav.js"></script>
<script src="i18n.dict.js"></script>
<script src="i18n.js"></script>
<script src="icons.js"></script>
<script src="js/core.js"></script>
<script src="js/subs.js"></script>
<script src="js/price.js"></script>
<script src="js/ai.js"></script>
<style>
  .saved-item{ display:flex; align-items:center; gap:var(--sp-3);
    background:var(--card); border:1px solid var(--border); border-radius:var(--r-md);
    padding:var(--sp-3) var(--sp-4); margin-bottom:var(--sp-2) }
  .saved-item .info{ flex:1; min-width:0 }
  .saved-item .name{ font-size:var(--fs-body); font-weight:700 }
  .saved-item .desc{ font-size:var(--fs-xs); color:var(--hint); margin-top:2px }
  .saved-item .del{ border:0; background:none; color:var(--hint); cursor:pointer;
    padding:6px; display:flex }
  .saved-item .del svg, .row-card .del svg{ width:18px; height:18px }
  .section-title{ font-size:var(--fs-sm); font-weight:700; color:var(--hint);
    margin:var(--sp-4) 0 var(--sp-2); text-transform:uppercase; letter-spacing:.03em }
</style>
</head>
<body>
  <h1><span class="emi" data-icon="bell"></span><span data-i18n="savedTitle"></span></h1>
  <p class="sub" data-i18n="savedSub"></p>

  <div class="section-title" data-i18n="secSaved"></div>
  <div id="savedList"></div>

  <div class="section-title" id="fav" data-i18n="secFav"></div>
  <div id="favList"></div>

  <div class="section-title" data-i18n="secSettings"></div>

  <!-- тихие часы: ночью буфер, утром сводка (хранится на сервере) -->
  <div class="saved-item" style="flex-wrap:wrap">
    <div class="ic-tile gold" data-icon="moon"></div>
    <div class="info">
      <div class="name" data-i18n="quietT"></div>
      <div class="desc" data-i18n="quietD"></div>
    </div>
    <label class="switch">
      <input type="checkbox" id="toggleQuiet">
      <span class="knob"></span>
    </label>
    <div id="quietHours" style="display:none; flex-basis:100%; margin-top:10px; gap:10px">
      <div style="flex:1">
        <label class="flabel" data-i18n="quietFrom"></label>
        <select id="quietFrom"></select>
      </div>
      <div style="flex:1">
        <label class="flabel" data-i18n="quietTo"></label>
        <select id="quietTo"></select>
      </div>
    </div>
  </div>

  <div class="saved-item">
    <div class="ic-tile violet" data-icon="sliders"></div>
    <div class="info">
      <div class="name" data-i18n="fbT"></div>
      <div class="desc" id="fbDesc"></div>
    </div>
    <label class="switch">
      <input type="checkbox" id="toggleFb">
      <span class="knob"></span>
    </label>
  </div>

  <a class="btn" href="search.html" style="margin-top:var(--sp-4)">
    <span class="emi" data-icon="search"></span> <span data-i18n="toSearch"></span>
  </a>

  <div class="section-title" data-i18n="privacyT"></div>

  <a class="saved-item" href="privacy.html" style="text-decoration:none; color:inherit">
    <div class="ic-tile blue" data-icon="shield-check"></div>
    <div class="info"><div class="name" data-i18n="privacyLink"></div></div>
    <div style="color:var(--hint)">›</div>
  </a>

  <div class="saved-item">
    <div class="ic-tile red" data-icon="trash"></div>
    <div class="info">
      <div class="name" data-i18n="delDataT"></div>
      <div class="desc" data-i18n="delDataD"></div>
    </div>
    <button class="btn sm" id="btnDelData"
      style="width:auto; flex:0 0 auto; background:#d1495b">
      <span class="emi" data-icon="trash"></span>
    </button>
  </div>

  <p class="foot" data-i18n="footSaved"></p>

  <!-- шторка деталей избранного -->
  <div class="overlay" id="overlay"><div class="sheet" id="sheet"></div></div>

<script>
"use strict";
if (window.Icons) Icons.hydrate();
I18N.hydrate();

function $(s) { return document.querySelector(s); }

function renderSaved() {
  var box = $("#savedList");
  if (!App.saved.length) {
    box.innerHTML = '<div class="state">' + App.esc(I18N.t("emptySaved")).replace("\n", "<br>") + "</div>";
    return;
  }
  box.innerHTML = App.saved.map(function (s, i) {
    return '<div class="saved-item">' +
      '<div class="ic-tile ' + (s.notify ? "green" : "") + '">' + Icons.svg("bell") + "</div>" +
      '<div class="info"><div class="name">' + App.esc(App.searchLabel(s)) + "</div>" +
      '<div class="desc">' + App.esc(I18N.t(s.notify ? "notifyOn" : "notifyOff")) + "</div></div>" +
      '<label class="switch"><input type="checkbox" data-i="' + i + '"' +
      (s.notify ? " checked" : "") + '><span class="knob"></span></label>' +
      '<button class="del" data-del="' + i + '">' + Icons.svg("trash") + "</button>" +
      "</div>";
  }).join("");
  box.querySelectorAll("input[type=checkbox]").forEach(function (cb) {
    cb.onchange = function () {
      App.saved[+cb.dataset.i].notify = cb.checked;
      App.persist(); haptic("select"); renderSaved();
    };
  });
  box.querySelectorAll("[data-del]").forEach(function (b) {
    b.onclick = function () {
      App.saved.splice(+b.dataset.del, 1);
      App.persist(); haptic("light"); renderSaved();
    };
  });
}

function renderFavs() {
  var box = $("#favList");
  if (!App.favs.length) {
    box.innerHTML = '<div class="state">' + App.esc(I18N.t("emptyFav")).replace("\n", "<br>") + "</div>";
    return;
  }
  box.innerHTML = App.favs.map(function (l, i) {
    var bits = [];
    if (l.rooms != null) bits.push(l.rooms + " " + I18N.t("roomsShort"));
    if (l.area != null) bits.push(l.area + " m²");
    bits.push(App.esc(App.cityName(l.city)) + (l.district ? ", " + App.esc(l.district) : ""));
    return '<a class="row-card" href="#" data-fav-open="' + i + '">' +
      '<div class="ic-tile red">' + Icons.svg("heart") + "</div>" +
      '<div class="body"><div class="t">' + l.price.toLocaleString() + " " + App.priceUnit(l.type) + "</div>" +
      '<div class="d">' + bits.join(" · ") + "</div></div>" +
      '<button class="del" data-fav-del="' + i + '" style="border:0;background:none;color:var(--hint);cursor:pointer;display:flex;padding:6px">' +
      Icons.svg("trash") + "</button>" +
      "</a>";
  }).join("");
  box.querySelectorAll("[data-fav-open]").forEach(function (a) {
    a.onclick = function (e) {
      if (e.target.closest("[data-fav-del]")) return;
      e.preventDefault();
      openSheet(App.favs[+a.dataset.favOpen]);
    };
  });
  box.querySelectorAll("[data-fav-del]").forEach(function (b) {
    b.onclick = function (e) {
      e.preventDefault(); e.stopPropagation();
      App.favs.splice(+b.dataset.favDel, 1);
      App.persist(); haptic("light"); renderFavs();
    };
  });
}

function openSheet(l) {
  haptic("light");
  var grad = l.grad || ["#3a6186", "#89253e"];
  var bg = "linear-gradient(135deg," + grad[0] + "," + grad[1] + ")";
  var photo = App.safePhotoUrl(l.photo);
  if (photo) bg = "url('" + photo + "') center/cover no-repeat, " + bg;
  var title = l.title ? App.esc(l.title) : App.esc(l.street || "");
  var _commute = App.commuteInfo(l);
  var specs = [
    [I18N.t("roomsLabel"), l.rooms],
    [I18N.t("area"), l.area != null ? l.area + " m²" : null],
    [I18N.t("floor"), l.floor],
    [I18N.t("toCenter"), _commute ? _commute.min + " " + I18N.t("minShort") : null],
    [I18N.t("published"), App.timeAgo(l.ts)]
  ].filter(function (s) { return s[1] != null; });
  $("#sheet").innerHTML =
    '<div style="position:relative">' +
    '<button class="close" id="btnClose">✕</button>' +
    '<div class="photo" style="background:' + bg + '">' +
    (photo ? "" : Icons.svg(l.icon || "home")) +
    '<span class="lbadge type">' + App.esc(I18N.t(l.type)) + "</span>" +
    "</div></div>" +
    '<div class="sbody">' +
    '<div class="lprice" style="font-size:22px">' + l.price.toLocaleString() + " " + App.priceUnit(l.type) +
    App.priceBadge(l) + "</div>" +
    '<div class="ltitle">' + title + " · " + App.esc(App.cityName(l.city)) +
    (l.district ? ", " + App.esc(l.district) : "") + "</div>" +
    '<div class="specs">' +
    specs.map(function (s) {
      return '<div class="spec"><div class="k">' + App.esc(s[0]) + '</div><div class="v">' + App.esc(s[1]) + "</div></div>";
    }).join("") +
    "</div>" +
    App.priceInsight(l) +
    (l.descr ? '<p class="muted" style="font-size:var(--fs-sm)">' + App.esc(l.descr) + "</p>" : "") +
    '<button class="btn" id="btnContact"><span class="emi">' +
    Icons.svg(l.url ? "key" : "message-circle") + "</span> " +
    App.esc(I18N.t(l.url ? "openSrc" : "write")) + "</button>" +
    "<div style='height:12px'></div></div>";
  $("#overlay").classList.add("open");
  App.mountAiButton($("#sheet").querySelector(".sbody"), l);
  $("#btnClose").onclick = closeSheet;
  $("#btnContact").onclick = function () {
    var tg = window.Telegram && window.Telegram.WebApp;
    if (l.url) {
      App.openListingUrl(l.url);   // только http/https
    } else if (tg && tg.openTelegramLink) {
      tg.openTelegramLink("https://t.me/KwadratPLBot");
    }
  };
  window.__navBack = function () {
    if ($("#overlay").classList.contains("open")) { closeSheet(); return true; }
    return false;
  };
}
function closeSheet() { $("#overlay").classList.remove("open"); }
$("#overlay").onclick = function (e) { if (e.target === e.currentTarget) closeSheet(); };

function renderSettings() {
  // ── тихие часы ──
  var qCb = $("#toggleQuiet"), qBox = $("#quietHours");
  var qFrom = $("#quietFrom"), qTo = $("#quietTo");
  function hourOpts(sel, val) {
    sel.innerHTML = "";
    for (var h = 0; h < 24; h++) {
      sel.innerHTML += '<option value="' + h + '"' + (h === val ? " selected" : "") + ">" +
        (h < 10 ? "0" : "") + h + ":00</option>";
    }
  }
  function syncQuietUI() {
    var q = App.getQuiet();
    qCb.checked = !!q;
    qBox.style.display = q ? "flex" : "none";
    hourOpts(qFrom, q ? q.from : 22);
    hourOpts(qTo, q ? q.to : 8);
  }
  function saveQuiet() {
    App.setQuiet(qCb.checked ? { from: +qFrom.value, to: +qTo.value } : null);
    if (typeof haptic === "function") haptic("select");
    syncQuietUI();
  }
  qCb.onchange = saveQuiet;
  qFrom.onchange = saveQuiet;
  qTo.onchange = saveQuiet;
  syncQuietUI();

  // ── источник Facebook (демо) ──
  var fbCb = $("#toggleFb");
  var enabled = localStorage.getItem("kw_src_fb") === "1";
  fbCb.checked = enabled;
  $("#fbDesc").textContent = I18N.t("fbD") + " · " + I18N.t(enabled ? "srcOn" : "srcOff");
  fbCb.onchange = function () {
    localStorage.setItem("kw_src_fb", fbCb.checked ? "1" : "0");
    if (typeof haptic === "function") haptic("select");
    // перезагрузка пересобирает инвентарь; пауза — чтобы тумблер доехал
    setTimeout(function () { location.reload(); }, 150);
  };
}

// удаление данных: серверная учётка (DELETE /api/subs) + локальные данные
var btnDel = document.getElementById("btnDelData");
if (btnDel) btnDel.onclick = function () {
  var tg = window.Telegram && window.Telegram.WebApp;
  function run() {
    haptic("warning");
    App.deleteAccount().then(function (r) {
      App.toast(I18N.t(r && r.deleted === false ? "delFail" : "delDone"));
      renderSaved(); renderFavs();
      try { renderSettings(); } catch (e) {}
    });
  }
  if (tg && tg.showConfirm) tg.showConfirm(I18N.t("delConfirm"), function (ok) { if (ok) run(); });
  else if (window.confirm(I18N.t("delConfirm"))) run();
};

renderSaved();
renderFavs();
renderSettings();
</script>
</body>
</html>
