en: {

    "<b>Return deadline</b>: 1 month from the day you vacate the flat.",
    "<b>Deductions allowed only</b> for unpaid rent and damage beyond normal wear. “Repainting because that's customary” is not a reason.",
    "<b>Indexation</b>: if you paid “two months of rent”, you get back two months of rent at the rate on the return date." ] },
  { h: "The foundation is laid on move-in day", p: ["90% of deposit disputes are won or lost on the first day of the lease."], list: [

    "Photograph and film every room, every scratch and stain. File metadata dates are your witness.",
    "Every defect goes into the protocol in writing, however small. Both signatures, keep a copy." ],

  { h: "During the tenancy", list: [
    "Report all issues <b>in writing</b> (messenger, e-mail). Verbal agreements don't exist in a dispute.",

    "Rule: return it “as received, minus natural ageing”." ] },
