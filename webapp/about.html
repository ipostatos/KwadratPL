      return;
    }
    var row = document.getElementById("starsRow");
    if (!row.childNodes.length) {
      [25, 100, 500].forEach(function (n) {
        var b = document.createElement("button");
        b.className = "btn ghost";
        b.style.flex = "1";
        b.textContent = "⭐ " + n;
        b.onclick = function () { payStars(n, row); };
        row.appendChild(b);
      });
    }
    row.classList.toggle("hidden");
    if (typeof haptic === "function") haptic("select");
  };

  function payStars(amount, row) {
    fetch(API + "/api/donate/link", {
      method: "POST",
      headers: { "Content-Type": "application/json",
                 "Authorization": "tma " + tg.initData },
      body: JSON.stringify({ amount: amount }),
    })
      .then(function (r) { if (!r.ok) throw 0; return r.json(); })
      .then(function (d) {
        tg.openInvoice(d.link, function (status) {
          if (status === "paid") {
            row.innerHTML = '<div style="flex:1; text-align:center; font-weight:700; padding:10px">💛 ' +
              I18N.t("starsThanks") + "</div>";
            if (typeof haptic === "function") haptic("success");
          }
        });
      })
      .catch(function () {
        // бэкенд недоступен — фолбэк в чат бота
        if (tg.openTelegramLink) tg.openTelegramLink("https://t.me/KwadratPLBot?start=donate");
      });
  }
})();
</script>
</body>
</html>
