<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>О сервисе — Kwadrat PL</title>
<link rel="stylesheet" href="theme.css">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="nav.js"></script>
<script src="i18n.js"></script>
<script src="icons.js"></script>
<style>
  /* благодарность автору — кнопки в столбик (паттерн ISSA) */
  .donate-row{ display:flex; flex-direction:column; gap:10px }
  .donate-row .btn{ width:100% }
  a{ text-decoration:none }
</style>
</head>
<body>
  <h1><span class="emi" data-icon="info"></span><span data-i18n="aboutT"></span></h1>
  <p class="sub" data-i18n="aboutSub"></p>

  <div class="row-card">
    <div class="ic-tile blue" data-icon="search"></div>
    <div class="body">
      <div class="t" data-i18n="f1t"></div>
      <div class="d" data-i18n="f1d"></div>
    </div>
  </div>

  <div class="row-card">
    <div class="ic-tile green" data-icon="bell"></div>
    <div class="body">
      <div class="t" data-i18n="f2t"></div>
      <div class="d" data-i18n="f2d"></div>
    </div>
  </div>

  <div class="row-card">
    <div class="ic-tile red" data-icon="trending-down"></div>
    <div class="body">
      <div class="t" data-i18n="f3t"></div>
      <div class="d" data-i18n="f3d"></div>
    </div>
  </div>

  <div class="row-card">
    <div class="ic-tile amber" data-icon="shield-check"></div>
    <div class="body">
      <div class="t" data-i18n="f4t"></div>
      <div class="d" data-i18n="f4d"></div>
    </div>
  </div>

  <div class="card" style="margin-top:var(--sp-4)">
    <div class="h2" data-i18n="statusT"></div>
    <p class="muted" style="font-size:var(--fs-sm); margin:0" data-i18n="statusD"></p>
  </div>

  <!-- Об авторе + благодарность (паттерн ISSA Trainer) -->
  <div class="card" style="margin-top:var(--sp-4)">
    <div class="h2" data-i18n="authorT"></div>
    <div class="muted" style="font-size:var(--fs-sm); line-height:1.6; margin-bottom:10px" data-i18n="authorP1"></div>
    <div class="muted" style="font-size:var(--fs-sm); line-height:1.6; margin-bottom:12px">
      <span data-i18n="authorP2"></span>
      <a href="https://t.me/ipostatos" target="_blank" rel="noopener"
         style="color:var(--accent)"><span class="emi" data-icon="send"></span>@ipostatos</a>.
    </div>
    <div class="donate-row">
      <a class="btn" href="https://buymeacoffee.com/ipostatos" target="_blank" rel="noopener">
        <span class="emi" data-icon="coffee"></span> <span data-i18n="donateCoffee"></span>
      </a>
      <a class="btn ghost" href="https://t.me/ipostatos" target="_blank" rel="noopener">
        <span class="emi" data-icon="star"></span> <span data-i18n="donateThanks"></span>
      </a>
    </div>
  </div>

  <a class="btn ghost" href="index.html" style="margin-top:var(--sp-4)" data-i18n="backHome"></a>

  <p class="foot" data-i18n="footAbout"></p>

<script>
"use strict";
if (window.Icons) Icons.hydrate();
I18N.hydrate();
</script>
</body>
</html>
