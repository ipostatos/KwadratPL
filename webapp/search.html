<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Поиск — Kwadrat PL</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="theme.css">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="nav.js"></script>
<script src="i18n.dict.js"></script>
<script src="i18n.js"></script>
<script src="icons.js"></script>
<script src="js/core.js"></script>
<script src="js/subs.js"></script>
<script src="js/price.js"></script>
<script src="js/explain.js"></script>
<script src="js/ai.js"></script>
<style>
  .toolbar{ display:flex; align-items:center; justify-content:space-between;
    margin:var(--sp-3) 0 var(--sp-2) }
  .toolbar .count{ font-size:var(--fs-sm); color:var(--hint) }
  .toolbar select{ width:auto; padding:6px 12px; font-size:var(--fs-sm) }
  .fabs{ display:flex; gap:var(--sp-2); margin-top:var(--sp-3) }
  .fabs .btn{ flex:1 }
</style>
</head>
<body>
  <h1><span class="emi" data-icon="search"></span><span data-i18n="searchTitle"></span></h1>
  <p class="sub" data-i18n="searchSub"></p>

  <!-- фильтры -->
  <div class="card" style="margin-bottom:var(--sp-2)">
    <div class="frow">
      <div class="fcol">
        <label class="flabel" data-i18n="city"></label>
        <select id="fCity"></select>
      </div>
      <div class="fcol">
        <label class="flabel" data-i18n="district"></label>
        <select id="fDistrict"></select>
      </div>
    </div>
    <div class="frow">
      <div class="fcol">
        <label class="flabel" data-i18n="rentType"></label>
        <div class="seg" id="fType">
          <button data-val="long" data-i18n="long"></button>
          <button data-val="room" data-i18n="room"></button>
          <button data-val="short" data-i18n="short"></button>
        </div>
      </div>
    </div>
    <div class="frow">
      <div class="fcol">
        <label class="flabel" data-i18n="ownerLabel"></label>
        <div class="seg" id="fOwner">
          <button data-val="" data-i18n="ownerAny"></button>
          <button data-val="private" data-i18n="ownerPrivate"></button>
          <button data-val="agency" data-i18n="ownerAgency"></button>
        </div>
      </div>
    </div>
    <div class="frow">
      <div class="fcol">
        <label class="flabel" data-i18n="priceFrom"></label>
        <input type="number" id="fPriceMin" placeholder="0" min="0" step="100">
      </div>
      <div class="fcol">
        <label class="flabel" data-i18n="priceTo"></label>
        <input type="number" id="fPriceMax" placeholder="10000" min="0" step="100">
      </div>
      <div class="fcol">
        <label class="flabel" data-i18n="areaFrom"></label>
        <input type="number" id="fAreaMin" placeholder="0" min="0" step="5">
      </div>
    </div>
    <div class="frow" id="rowRooms">
      <div class="fcol">
        <label class="flabel" data-i18n="roomsLabel"></label>
        <div class="seg" id="fRooms">
          <button data-val="0" data-i18n="anyRooms"></button>
          <button data-val="1">1</button>
          <button data-val="2">2</button>
          <button data-val="3">3</button>
          <button data-val="4">4+</button>
        </div>
      </div>
    </div>
    <div class="frow" style="margin-bottom:0">
      <div class="fcol">
        <label class="flabel" data-i18n="featuresLabel"></label>
        <div class="seg" id="fFeat">
          <button data-key="pets">🐾 <span data-i18n="fPets"></span></button>
          <button data-key="parking">🅿️ <span data-i18n="fParking"></span></button>
          <button data-key="balcony">🌿 <span data-i18n="fBalcony"></span></button>
        </div>
      </div>
    </div>
    <div class="fabs">
      <button class="btn" id="btnSave"><span class="emi" data-icon="bell"></span> <span data-i18n="subscribe"></span></button>
    </div>
  </div>

  <!-- Крупнейшие Facebook-группы аренды/подселения по выбранному городу -->
  <div class="card" id="fbCard" style="margin-bottom:var(--sp-2)">
    <div class="h2" style="display:flex; align-items:center; gap:8px">
      <span class="emi" data-icon="users"></span><span data-i18n="fbGroupsT"></span>
    </div>
    <p class="muted" id="fbGroupsDesc" style="font-size:var(--fs-sm)"></p>
    <div id="fbLinks" style="display:flex; flex-direction:column; gap:8px"></div>
    <p class="muted" id="fbMore" style="font-size:var(--fs-sm); margin:10px 0 0"></p>
  </div>

  <div class="toolbar">
    <span class="count" id="count"></span>
    <a class="btn ghost sm" href="mapa.html" style="width:auto; margin-right:8px; padding:6px 12px"
       title="Mapa"><span class="emi" data-icon="map-pin"></span></a>
    <select id="sort">
      <option value="new" data-i18n="sortNew"></option>
      <option value="fit" data-i18n="sortFit"></option>
      <option value="priceAsc" data-i18n="sortPriceAsc"></option>
      <option value="priceDesc" data-i18n="sortPriceDesc"></option>
      <option value="areaDesc" data-i18n="sortArea"></option>
    </select>
  </div>

  <div id="list"></div>

  <button class="btn ghost" id="btnSim" style="margin-top:var(--sp-2)">
    <span class="emi" data-icon="zap"></span> <span data-i18n="simulate"></span>
  </button>

  <p class="foot" data-i18n="footSearch"></p>

  <!-- шторка деталей -->
  <div class="overlay" id="overlay"><div class="sheet" id="sheet"></div></div>

<script>
"use strict";
if (window.Icons) Icons.hydrate();
I18N.hydrate();

var qs = new URLSearchParams(location.search);
var state = {
  city: App.CITIES[qs.get("city")] ? qs.get("city") : "warszawa",
  district: "",
  type: ["short", "room"].indexOf(qs.get("type")) >= 0 ? qs.get("type") : "long",
  owner: ["private", "agency"].indexOf(qs.get("owner")) >= 0 ? qs.get("owner") : "",
  priceMin: null, priceMax: null, areaMin: null,
  rooms: 0, sort: "new",
  pets: qs.get("pets") === "1",
  parking: qs.get("parking") === "1",
  balcony: qs.get("balcony") === "1"
};

function $(s) { return document.querySelector(s); }

/* ── фильтры: рендер контролов ── */
function renderControls() {
  $("#fCity").innerHTML = Object.keys(App.CITIES).map(function (k) {
    return '<option value="' + k + '"' + (k === state.city ? " selected" : "") + ">" +
      App.esc(App.cityName(k)) + "</option>";
  }).join("");
  renderDistricts();
  document.querySelectorAll("#fType button").forEach(function (b) {
    b.classList.toggle("active", b.dataset.val === state.type);
  });
  document.querySelectorAll("#fRooms button").forEach(function (b) {
    b.classList.toggle("active", +b.dataset.val === state.rooms);
  });
  document.querySelectorAll("#fOwner button").forEach(function (b) {
    b.classList.toggle("active", b.dataset.val === state.owner);
  });
  document.querySelectorAll("#fFeat button").forEach(function (b) {
    b.classList.toggle("active", !!state[b.dataset.key]);
  });
  syncTypeUI();
}

/* у комнат нет счётчика комнат: фильтр прячем и сбрасываем,
   иначе реальные объявления (rooms=null) отфильтруются в ноль */
function syncTypeUI() {
  var isRoom = state.type === "room";
  $("#rowRooms").style.display = isRoom ? "none" : "";
  if (isRoom && state.rooms) {
    state.rooms = 0;
    document.querySelectorAll("#fRooms button").forEach(function (x) {
      x.classList.toggle("active", +x.dataset.val === 0);
    });
  }
  renderFbCard();
}

/* ── Facebook: крупнейшие группы аренды/подселения по городам (кураторский
   список, проверен 2026-07: URL живые, группы индексируются поиском) +
   живой поиск групп по языкам ── */
var FB_GROUPS = {
  warszawa: [
    { name: "Warszawa – pokoje / mieszkania wynajem", url: "https://www.facebook.com/groups/warszawa.pokoje.mieszkania.wynajem/", members: "183k", lang: "pl" },
    { name: "Warszawa wynajmę mieszkanie/pokój, szukam współlokatora", url: "https://www.facebook.com/groups/wynajemwarszawa/", members: "120k", lang: "pl" },
    { name: "Варшава. Комната, квартира, дом в аренду", url: "https://www.facebook.com/groups/1829896053907314/", members: null, lang: "ru" },
    { name: "В нашій хаті — оренда кімнат у Варшаві", url: "https://www.facebook.com/groups/orenda.kwartyr.Warszawa/", members: null, lang: "ua" },
    /* группа от user 2026-07-20 (польскоязычная); контент за логин-воллом FB
       не проверить — подпись по назначению (аренда, дружелюбная к животным) */
    { name: "🐱🐶 Wynajem przyjazny zwierzętom — Warszawa", url: "https://www.facebook.com/groups/475190236020823/", members: null, lang: "pl" }
  ],
  krakow: [
    { name: "Mieszkania i pokoje do wynajęcia - Kraków", url: "https://www.facebook.com/groups/wynajemkrakow/", members: null, lang: "pl" },
    { name: "Stacja stancja Kraków - pokoje i mieszkania", url: "https://www.facebook.com/groups/stacjastancjakrakow/", members: null, lang: "pl" },
    { name: "Краков. Комната, квартира, дом в аренду", url: "https://www.facebook.com/groups/420964518330884/", members: null, lang: "ru" },
    { name: "Житло Краків. Оренда / купівля", url: "https://www.facebook.com/groups/estateinkrakow/", members: null, lang: "ua" }
  ],
  wroclaw: [
    { name: "Wrocław na wynajem - mieszkania, pokoje", url: "https://www.facebook.com/groups/livehereWROCLOVE/", members: null, lang: "pl" },
    { name: "Stacja stancja Wrocław - pokoje i mieszkania", url: "https://www.facebook.com/groups/stacjastancjawroclaw/", members: null, lang: "pl" },
    { name: "Вроцлав. Комната, квартира, дом в аренду", url: "https://www.facebook.com/groups/244457332777718/", members: null, lang: "ru" },
    { name: "Оренда житла у Вроцлаві", url: "https://www.facebook.com/groups/622402819249571/", members: null, lang: "ua" }
  ],
  gdansk: [
    { name: "Stancje w Trójmieście. Mieszkania - Gdańsk", url: "https://www.facebook.com/groups/stancje.trojmiasto/", members: null, lang: "pl" },
    { name: "Mieszkania do wynajęcia - Gdańsk, Sopot, Gdynia", url: "https://www.facebook.com/groups/wynajem.3miasto/", members: null, lang: "pl" },
    { name: "Гданьск, Гдыня, Сопот. Аренда жилья", url: "https://www.facebook.com/groups/500493130352769/", members: null, lang: "ru" },
    { name: "Житло Trójmiasto Гданськ — оренда, купівля", url: "https://www.facebook.com/groups/931147294272377/", members: null, lang: "ua" }
  ],
  poznan: [
    { name: "Mieszkania i pokoje do wynajęcia - Poznań", url: "https://www.facebook.com/groups/poznanwynajem/", members: null, lang: "pl" },
    { name: "Poznań Wynajmę Pokoje Mieszkania", url: "https://www.facebook.com/groups/wynajem/", members: null, lang: "pl" },
    { name: "Аренда комнат, квартир в Познани", url: "https://www.facebook.com/groups/354430122916166/", members: null, lang: "ru" },
    { name: "Житло у Познані | Польша", url: "https://www.facebook.com/groups/353348179107454/", members: null, lang: "ua" }
  ],
  lodz: [
    { name: "Wynajem: pokoje, mieszkania, stancje Łódź", url: "https://www.facebook.com/groups/1142712565753245/", members: null, lang: "pl" },
    { name: "Stacja stancja Łódź - pokoje i mieszkania", url: "https://www.facebook.com/groups/stacjastancjalodz/", members: null, lang: "pl" },
    { name: "Жилье в Лодзи", url: "https://www.facebook.com/groups/306480459949658/", members: null, lang: "ru" },
    { name: "Łódź — оренда кімнат, ночліги", url: "https://www.facebook.com/groups/360794365706607/", members: null, lang: "ua" }
  ]
};
var FB_FLAGS = { pl: "🇵🇱", ru: "🇷🇺", ua: "🇺🇦" };
function fbSearchUrl(q) {
  return "https://www.facebook.com/search/groups/?q=" + encodeURIComponent(q);
}
function openExternal(url) {
  haptic("light");
  var tg = window.Telegram && window.Telegram.WebApp;
  if (tg && tg.openLink) tg.openLink(url);
  else window.open(url, "_blank", "noopener");
}
function renderFbCard() {
  var names = KW_I18N.CITY_NAMES[state.city];
  $("#fbGroupsDesc").textContent = I18N.t("fbGroupsD", { city: I18N.cityName(state.city) });
  var groups = FB_GROUPS[state.city] || [];
  $("#fbLinks").innerHTML = groups.map(function (g, i) {
    return '<button class="btn ghost sm" data-fbg="' + i + '" style="justify-content:flex-start; text-align:left">' +
      '<span class="emi">' + Icons.svg("facebook") + "</span> " +
      (FB_FLAGS[g.lang] || "") + " " + App.esc(g.name) +
      (g.members ? ' <span class="muted" style="font-weight:400">· ' + App.esc(g.members) + "</span>" : "") +
      "</button>";
  }).join("");
  document.querySelectorAll("#fbLinks [data-fbg]").forEach(function (b) {
    b.onclick = function () { openExternal(groups[+b.dataset.fbg].url); };
  });
  // строка «найти ещё»: живой поиск групп FB с готовым запросом по городу
  var roomQ = state.type === "room";
  var more = [
    { t: I18N.t("fbGroupsPL"), url: fbSearchUrl((roomQ ? "pokój do wynajęcia " : "mieszkanie do wynajęcia ") + names.pl) },
    { t: I18N.t("fbGroupsRU"), url: fbSearchUrl((roomQ ? "подселение " : "аренда жилья ") + names.ru) },
    { t: I18N.t("fbGroupsUA"), url: fbSearchUrl((roomQ ? "підселення " : "оренда житла ") + names.ua) }
  ];
  $("#fbMore").innerHTML = App.esc(I18N.t("fbGroupsMore")) + " " +
    more.map(function (x, i) {
      return '<a href="#" data-fbm="' + i + '" style="color:var(--accent)">' + App.esc(x.t) + "</a>";
    }).join(" · ");
  document.querySelectorAll("#fbMore [data-fbm]").forEach(function (a) {
    a.onclick = function (e) { e.preventDefault(); openExternal(more[+a.dataset.fbm].url); };
  });
}
function renderDistricts() {
  $("#fDistrict").innerHTML = '<option value="">' + App.esc(I18N.t("allDistricts")) + "</option>" +
    App.districtsFor(state.city).map(function (d) {
      return '<option value="' + App.esc(d) + '"' + (d === state.district ? " selected" : "") + ">" +
        App.esc(d) + "</option>";
    }).join("");
}

/* ── выборка ── */
function filtered() {
  var res = App.listings.filter(function (l) { return App.matches(l, state); });
  var sorters = {
    new: function (a, b) { return b.ts - a.ts; },
    priceAsc: function (a, b) { return a.price - b.price; },
    priceDesc: function (a, b) { return b.price - a.price; },
    areaDesc: function (a, b) { return b.area - a.area; },
    // «Лучшее для меня»: выгода + локация + близость к работе (js/explain.js)
    fit: function (a, b) { return App.fitScore(b) - App.fitScore(a); }
  };
  return res.sort(sorters[state.sort]);
}

function photoHtml(l, cls) {
  var isNew = Date.now() - l.ts < 3 * 3600000;
  var bg = "linear-gradient(135deg," + l.grad[0] + "," + l.grad[1] + ")";
  // у реальных объявлений фото поверх града (град виден, пока фото грузится);
  // URL валидируется и чистится — данные из OLX не должны ломать style
  // одинарные кавычки в url(): style="…" уже в двойных, а safePhotoUrl
  // вычищает из URL кавычки/скобки — инъекции нет, а атрибут не рвётся
  var photo = App.safePhotoUrl(l.photo);
  if (photo) bg = "url('" + photo + "') center/cover no-repeat, " + bg;
  return '<div class="photo" style="background:' + bg + '">' +
    (photo ? "" : Icons.svg(l.icon)) +
    '<div class="lbadges">' +
    (isNew ? '<span class="lbadge new">NEW</span>' : "") +
    (l.oldPrice ? '<span class="lbadge drop">−' + (l.oldPrice - l.price) + " zł</span>" : "") +
    "</div>" +
    '<span class="lbadge type">' + App.esc(I18N.t(l.type)) + "</span>" +
    (cls === "card" ? '<button class="fav-btn' + (App.isFav(l.id) ? " on" : "") +
      '" data-fav="' + App.esc(l.id) + '">' + Icons.svg("heart") + "</button>" : "") +
    "</div>";
}

function renderList() {
  var res = filtered();
  $("#count").textContent = I18N.t("found", { n: res.length });
  var list = $("#list");
  if (!res.length) {
    list.innerHTML = '<div class="state">' + App.esc(I18N.t("emptyList")).replace("\n", "<br>") + "</div>";
    return;
  }
  list.innerHTML = res.map(function (l) {
    return '<div class="listing" data-id="' + App.esc(l.id) + '">' +
      photoHtml(l, "card") +
      '<div class="lbody">' +
      '<div class="lprice">' + l.price.toLocaleString() + " " + App.priceUnit(l.type) +
      (l.oldPrice ? '<span class="old">' + l.oldPrice.toLocaleString() + "</span>" : "") +
      App.priceBadge(l) + "</div>" +
      '<div class="ltitle">' + listingTitle(l) + "</div>" +
      '<div class="lmeta"><span>📍 ' + App.esc(App.cityName(l.city)) +
      (l.district ? ", " + App.esc(l.district) : "") +
      "</span><span>🕐 " + App.timeAgo(l.ts) + "</span><span>📎 " + App.esc(l.source) +
      (l.agency != null ? " · " + I18N.t(l.agency ? "ownerAgency" : "ownerPrivate") : "") + "</span></div>" +
      "</div></div>";
  }).join("");
}

// заголовок карточки: у реальных — заголовок оффера, у демо — сводка
function listingTitle(l) {
  if (l.title) return App.esc(l.title);
  var parts = [];
  if (l.rooms != null) parts.push(l.rooms + " " + I18N.t("roomsShort"));
  if (l.area != null) parts.push(l.area + " m²");
  if (l.street) parts.push(App.esc(l.street));
  return parts.join(" · ");
}

/* ── шторка деталей ── */
function openSheet(id) {
  var l = App.listings.find(function (x) { return x.id === id; });
  if (!l) return;
  haptic("light");
  var _commute = App.commuteInfo(l);
  var specs = [
    [I18N.t("roomsLabel"), l.rooms],
    [I18N.t("area"), l.area != null ? l.area + " m²" : null],
    [I18N.t("floor"), l.floor],
    [I18N.t("toCenter"), _commute ? _commute.min + " " + I18N.t("minShort") : null],
    // предрасчитанная оценка локации (geo_enrich, только точные координаты)
    [I18N.t("locSpec"), l.locScore != null ? "📍 " + l.locScore + "/100" : null],
    [I18N.t("published"), App.timeAgo(l.ts)]
  ].filter(function (s) { return s[1] != null; });
  var descr = l.descr || (l.title ? "" : I18N.t("descr"));
  $("#sheet").innerHTML =
    '<div style="position:relative">' +
    '<button class="close" id="btnClose">✕</button>' + photoHtml(l) + "</div>" +
    '<div class="sbody">' +
    '<div class="lprice" style="font-size:22px">' + l.price.toLocaleString() + " " + App.priceUnit(l.type) +
    (l.oldPrice ? '<span class="old">' + l.oldPrice.toLocaleString() + "</span>" : "") +
    App.priceBadge(l) + "</div>" +
    '<div class="ltitle">' + listingTitle(l) + " · " + App.esc(App.cityName(l.city)) +
    (l.district ? ", " + App.esc(l.district) : "") + "</div>" +
    '<div class="specs">' +
    specs.map(function (s) {
      return '<div class="spec"><div class="k">' + App.esc(s[0]) + '</div><div class="v">' + App.esc(s[1]) + "</div></div>";
    }).join("") +
    "</div>" +
    App.priceInsight(l) +
    // оценка локации (пока только Варшава): с координатами от geo_enrich идём
    // сразу в точку (+честная пометка точности), без них — геокод по улице/району
    (l.city === "warszawa"
      ? '<a class="btn ghost" style="margin-top:12px" href="' +
        (l.lat != null && l.lon != null
          ? "lokacja.html?lat=" + l.lat + "&lon=" + l.lon +
            "&prec=" + encodeURIComponent(l.geoPrec || "")
          : "lokacja.html?q=" +
            encodeURIComponent((l.street || l.district || "") + ", Warszawa")) +
        '"><span class="emi">' + Icons.svg("gauge") + "</span> " +
        App.esc(I18N.t("locT")) + "</a>"
      : "") +
    (descr ? '<p class="muted" style="font-size:var(--fs-sm)">' + App.esc(descr) + "</p>" : "") +
    '<div style="display:flex; gap:8px; margin-top:12px">' +
    '<button class="btn" id="btnContact"><span class="emi">' +
    Icons.svg(l.url ? "key" : "message-circle") + "</span> " +
    App.esc(I18N.t(l.url ? "openSrc" : "write")) + "</button>" +
    '<button class="btn ghost" id="btnFavSheet" style="width:auto; flex:0 0 auto">' +
    '<span class="emi">' + Icons.svg("heart") + "</span></button>" +
    "</div><div style='height:12px'></div></div>";
  $("#overlay").classList.add("open");
  App.mountAiButton($("#sheet").querySelector(".sbody"), l);
  $("#btnClose").onclick = closeSheet;
  $("#btnContact").onclick = function () {
    var tg = window.Telegram && window.Telegram.WebApp;
    if (l.url) {
      // реальное объявление: открываем на площадке-источнике (только http/https)
      App.openListingUrl(l.url);
    } else if (tg && tg.openTelegramLink) {
      tg.openTelegramLink("https://t.me/KwadratPLBot");
    }
  };
  var fb = $("#btnFavSheet");
  function syncFav() { fb.style.color = App.isFav(l.id) ? "#ff6b81" : ""; }
  syncFav();
  fb.onclick = function () {
    var added = App.toggleFav(l);
    haptic("select");
    syncFav(); renderList();
    App.toast(added ? "❤️" : "💔", I18N.t(added ? "favAdded" : "favRemoved"),
      l.rooms + " " + I18N.t("roomsShort") + " · " + l.price.toLocaleString() + " " + App.priceUnit(l.type));
  };
  // системная «назад» закрывает шторку, а не уводит со страницы
  window.__navBack = function () {
    if ($("#overlay").classList.contains("open")) { closeSheet(); return true; }
    return false;
  };
}
function closeSheet() { $("#overlay").classList.remove("open"); }

/* ── события ── */
$("#fCity").onchange = function (e) {
  state.city = e.target.value; state.district = "";
  renderDistricts(); renderFbCard(); renderList();
};
$("#fDistrict").onchange = function (e) { state.district = e.target.value; renderList(); };
document.querySelectorAll("#fType button").forEach(function (b) {
  b.onclick = function () {
    state.type = b.dataset.val; haptic("select");
    document.querySelectorAll("#fType button").forEach(function (x) {
      x.classList.toggle("active", x === b);
    });
    syncTypeUI();
    renderList();
  };
});
document.querySelectorAll("#fRooms button").forEach(function (b) {
  b.onclick = function () {
    state.rooms = +b.dataset.val; haptic("select");
    document.querySelectorAll("#fRooms button").forEach(function (x) {
      x.classList.toggle("active", x === b);
    });
    renderList();
  };
});
document.querySelectorAll("#fOwner button").forEach(function (b) {
  b.onclick = function () {
    state.owner = b.dataset.val; haptic("select");
    document.querySelectorAll("#fOwner button").forEach(function (x) {
      x.classList.toggle("active", x === b);
    });
    renderList();
  };
});
document.querySelectorAll("#fFeat button").forEach(function (b) {
  b.onclick = function () {
    state[b.dataset.key] = !state[b.dataset.key];
    b.classList.toggle("active", state[b.dataset.key]);
    haptic("select");
    renderList();
  };
});
$("#fPriceMin").oninput = function (e) { state.priceMin = e.target.value === "" ? null : +e.target.value; renderList(); };
$("#fPriceMax").oninput = function (e) { state.priceMax = e.target.value === "" ? null : +e.target.value; renderList(); };
$("#fAreaMin").oninput = function (e) { state.areaMin = e.target.value === "" ? null : +e.target.value; renderList(); };
$("#sort").onchange = function (e) { state.sort = e.target.value; renderList(); };

$("#btnSave").onclick = function () {
  App.saved.push({
    city: state.city, district: state.district, type: state.type,
    owner: state.owner,
    priceMin: state.priceMin, priceMax: state.priceMax,
    areaMin: state.areaMin, rooms: state.rooms,
    pets: state.pets, parking: state.parking, balcony: state.balcony,
    notify: true
  });
  App.persist();
  App.toast("🔖", I18N.t("toastSubT"),
    I18N.t("toastSubD", { s: App.searchLabel(App.saved[App.saved.length - 1]) }));
};

$("#btnSim").onclick = function () {
  // генерируем объявление под первую активную подписку — чтобы уведомление сработало;
  // без подписок — под текущие фильтры
  var s = App.saved.find(function (x) { return x.notify; }) || state;
  var over = { city: s.city, type: s.type };
  if (s.district) over.district = s.district;
  if (s.rooms) over.rooms = s.rooms === 4 ? 4 : s.rooms;
  if (s.owner) over.agency = s.owner === "agency";  // иначе симуляция не пройдёт свой же фильтр
  // amenity-фильтры подписки должны выполняться, иначе уведомление соврёт
  if (s.pets) over.pets = true;
  if (s.parking) over.parking = true;
  if (s.balcony) over.balcony = true;
  var l = App.makeListing(over);
  l.ts = Date.now();
  if (s.priceMax) l.price = Math.min(l.price, s.priceMax - 50);
  if (s.priceMin != null) l.price = Math.max(l.price, s.priceMin);
  if (s.areaMin) l.area = Math.max(l.area, s.areaMin + 5);
  App.listings.unshift(l);
  App.toast("🔔", I18N.t("toastNewT"),
    l.rooms + " " + I18N.t("roomsShort") + " · " + l.area + " m² · " + l.price.toLocaleString() + " " +
    App.priceUnit(l.type) + " — " + App.cityName(l.city) + ", " + l.district);
  renderList();
};

$("#list").onclick = function (e) {
  var favBtn = e.target.closest("[data-fav]");
  if (favBtn) {
    e.stopPropagation();
    var lf = App.listings.find(function (x) { return x.id === favBtn.dataset.fav; });
    if (lf) { App.toggleFav(lf); haptic("select"); renderList(); }
    return;
  }
  var card = e.target.closest(".listing");
  if (card) openSheet(card.dataset.id);
};
$("#overlay").onclick = function (e) { if (e.target === e.currentTarget) closeSheet(); };

/* ── init: ждём инвентарь (реальный или демо-фолбэк) ── */
App.ready.then(function () {
  renderControls();
  renderList();
  // deep-link с карты (mapa.html): ?open=<id> — сразу открыть шторку
  var openId = qs.get("open");
  if (openId && App.listings.some(function (l) { return String(l.id) === openId; })) {
    setTimeout(function () { openSheet(openId); }, 60);
  }
  if (!App.live) {
    document.querySelector('[data-i18n="footSearch"]').textContent = I18N.t("footSearchDemo");
    /* фоновая симуляция снижения цены — только в демо-режиме:
       на реальных объявлениях цену подделывать нельзя */
    setTimeout(function () {
      var cand = App.listings.filter(function (l) {
        return !l.oldPrice && l.city === state.city && l.type === state.type;
      });
      if (!cand.length) return;
      var l = cand[0];
      l.oldPrice = l.price;
      l.price = Math.round(l.price * 0.93 / 10) * 10;
      App.toast("📉", I18N.t("toastDropT"), l.street + " · " +
        l.oldPrice.toLocaleString() + " → " + l.price.toLocaleString() + " " + App.priceUnit(l.type));
      renderList();
    }, 25000);
  }
});
</script>
</body>
</html>
