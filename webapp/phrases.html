var PHRASES = [
{ t: {ru:"Отклик на объявление", pl:"Odpowiedź na ogłoszenie", ua:"Відгук на оголошення", by:"Водгук на аб'яву", en:"Replying to a listing"},
  n: {ru:"Первое сообщение. Коротко о себе — это сильно повышает шанс ответа.", pl:"Pierwsza wiadomość — krótko o sobie.", ua:"Перше повідомлення. Коротко про себе — це сильно підвищує шанс відповіді.", by:"Першае паведамленне. Коратка пра сябе — гэта моцна павышае шанец адказу.", en:"First contact. A short intro greatly boosts reply rates."},
  pl: "Dzień dobry! Piszę w sprawie ogłoszenia o wynajmie mieszkania przy ul. [ulica]. Jestem zainteresowany/a wynajmem od [data] na dłuższy okres. Pracuję jako [zawód], mieszkam [sam/sama / z partnerem / z rodziną]. Nie palę. Czy mieszkanie jest nadal dostępne i czy mógłbym/mogłabym umówić się na oglądanie? Pozdrawiam, [imię]",
  tr: {ru:"«Добрый день! Пишу по объявлению об аренде квартиры на ул. [улица]. Заинтересован(а) в аренде с [дата] на длительный срок. Работаю [профессия], живу [один/одна / с партнёром / с семьёй]. Не курю. Квартира ещё доступна, и можно ли договориться о просмотре? С уважением, [имя]»",
       ua:"«Добрий день! Пишу щодо оголошення про оренду квартири на вул. [вулиця]. Зацікавлений(а) в оренді з [дата] на тривалий строк. Працюю [професія], мешкаю [сам/сама / з партнером / із сім'єю]. Не курю. Чи квартира ще доступна, і чи можна домовитися про огляд? З повагою, [ім'я]»",
       by:"«Добры дзень! Пішу па аб'яве пра арэнду кватэры на вул. [вуліца]. Зацікаўлены(а) ў арэндзе з [дата] на працяглы тэрмін. Працую [прафесія], жыву [адзін/адна / з партнёрам / з сям'ёй]. Не курю. Кватэра яшчэ даступная, і ці можна дамовіцца пра агляд? З павагай, [імя]»",
       en:"“Good afternoon! I'm writing about the listing for the flat on [street] St. I'm interested in renting from [date] long-term. I work as a [profession], I live [alone / with a partner / with family]. I don't smoke. Is the flat still available, and could I arrange a viewing? Best regards, [name]”"} },
{ t: {ru:"Вопросы перед просмотром", pl:"Pytania przed oglądaniem", ua:"Питання перед оглядом", by:"Пытанні перад аглядам", en:"Questions before a viewing"},
  n: {ru:"Сэкономит поездку, если что-то не подходит.", pl:"Oszczędzi dojazd, jeśli coś nie pasuje.", ua:"Заощадить поїздку, якщо щось не підходить.", by:"Зэканоміць паездку, калі нешта не падыходзіць.", en:"Saves a trip if something's a dealbreaker."},
  pl: "Dzień dobry! Zanim umówimy się na oglądanie, chciałbym/chciałabym dopytać: 1) Jaka jest pełna miesięczna kwota razem z czynszem administracyjnym i mediami? 2) Jaka jest wysokość kaucji? 3) Czy mieszkanie jest dostępne od [data]? 4) Czy akceptują Państwo [zwierzęta / dzieci / parę]? 5) Czy możliwe jest zameldowanie? Z góry dziękuję za odpowiedź!",
  tr: {ru:"«Добрый день! Прежде чем договориться о просмотре, хочу уточнить: 1) Какова полная месячная сумма вместе с administracyjny и коммуналкой? 2) Каков размер кауции? 3) Квартира доступна с [дата]? 4) Принимаете ли вы [животных / детей / пару]? 5) Возможен ли мелдунек (регистрация)? Заранее спасибо за ответ!»",
       ua:"«Добрий день! Перш ніж домовитися про огляд, хочу уточнити: 1) Яка повна місячна сума разом з administracyjny та комуналкою? 2) Який розмір кауції? 3) Квартира доступна з [дата]? 4) Чи приймаєте ви [тварин / дітей / пару]? 5) Чи можливий мелдунок (реєстрація)? Заздалегідь дякую за відповідь!»",
       by:"«Добры дзень! Перш чым дамовіцца пра агляд, хачу ўдакладніць: 1) Якая поўная месячная сума разам з administracyjny і камуналкай? 2) Які памер кауцыі? 3) Кватэра даступная з [дата]? 4) Ці прымаеце вы [жывёл / дзяцей / пару]? 5) Ці магчымы мельдунак (рэгістрацыя)? Загадзя дзякуй за адказ!»",
       en:"“Good afternoon! Before we arrange a viewing, I'd like to ask: 1) What is the full monthly amount including the building fee and utilities? 2) How much is the deposit? 3) Is the flat available from [date]? 4) Do you accept [pets / children / a couple]? 5) Is residence registration (meldunek) possible? Thank you in advance!”"} },
{ t: {ru:"Договориться о просмотре", pl:"Umówienie oglądania", ua:"Домовитися про огляд", by:"Дамовіцца пра агляд", en:"Arranging a viewing"},
  n: {ru:"", pl:"", ua:"", by:"", en:""},
  pl: "Dzień dobry! Czy mógłbym/mogłabym obejrzeć mieszkanie w tym tygodniu? Pasuje mi [dzień] po godzinie [godzina] albo [dzień] w ciągu dnia. Proszę o informację, który termin Państwu odpowiada. Pozdrawiam!",
  tr: {ru:"«Добрый день! Могу ли я посмотреть квартиру на этой неделе? Мне подходит [день] после [время] или [день] в течение дня. Сообщите, пожалуйста, какое время вам удобно. С уважением!»",
       ua:"«Добрий день! Чи можу я подивитися квартиру цього тижня? Мені підходить [день] після [час] або [день] протягом дня. Повідомте, будь ласка, який час вам зручний. З повагою!»",
       by:"«Добры дзень! Ці магу я паглядзець кватэру на гэтым тыдні? Мне падыходзіць [дзень] пасля [час] або [дзень] на працягу дня. Паведаміце, калі ласка, які час вам зручны. З павагай!»",
       en:"“Good afternoon! Could I view the flat this week? [Day] after [time] works for me, or [day] during the day. Please let me know which time suits you. Regards!”"} },
{ t: {ru:"Сообщить о поломке", pl:"Zgłoszenie usterki", ua:"Повідомити про поломку", by:"Паведаміць пра паломку", en:"Reporting a fault"},
  n: {ru:"Письменное сообщение = доказательство. Фото прикладывайте всегда.", pl:"Pisemne zgłoszenie = dowód. Zawsze dołącz zdjęcie.", ua:"Письмове повідомлення = доказ. Фото додавайте завжди.", by:"Пісьмовае паведамленне = доказ. Фота дадавайце заўсёды.", en:"A written report = evidence. Always attach a photo."},
  pl: "Dzień dobry! Chciałbym/chciałabym zgłosić usterkę w mieszkaniu: [opis problemu, np. przecieka kran w łazience / nie działa lodówka]. Problem pojawił się [kiedy]. Przesyłam zdjęcie. Proszę o informację, kiedy będzie możliwa naprawa. Dziękuję i pozdrawiam, [imię]",
  tr: {ru:"«Добрый день! Хочу сообщить о неисправности в квартире: [описание проблемы, напр. течёт кран в ванной / не работает холодильник]. Проблема появилась [когда]. Прилагаю фото. Сообщите, пожалуйста, когда возможен ремонт. Спасибо и с уважением, [имя]»",
       ua:"«Добрий день! Хочу повідомити про несправність у квартирі: [опис проблеми, напр. тече кран у ванній / не працює холодильник]. Проблема з'явилася [коли]. Додаю фото. Повідомте, будь ласка, коли можливий ремонт. Дякую і з повагою, [ім'я]»",
       by:"«Добры дзень! Хачу паведаміць пра няспраўнасць у кватэры: [апісанне праблемы, напр. цячэ кран у ваннай / не працуе халадзільнік]. Праблема з'явілася [калі]. Дадаю фота. Паведаміце, калі ласка, калі магчымы рамонт. Дзякуй і з павагай, [імя]»",
       en:"“Good afternoon! I'd like to report a fault in the flat: [description, e.g. the bathroom tap is leaking / the fridge doesn't work]. The problem appeared [when]. Photo attached. Please let me know when a repair is possible. Thank you, [name]”"} },
{ t: {ru:"Напомнить о ремонте", pl:"Przypomnienie o naprawie", ua:"Нагадати про ремонт", by:"Напомніць пра рамонт", en:"Chasing a repair"},
  n: {ru:"Если владелец тянет. Вежливо, но со ссылкой на обязанность.", pl:"Gdy właściciel zwleka.", ua:"Якщо власник зволікає. Ввічливо, але з посиланням на обов'язок.", by:"Калі гаспадар зацягвае. Ветліва, але са спасылкай на абавязак.", en:"When the landlord stalls. Polite but firm."},
  pl: "Dzień dobry! Wracam do zgłoszonej [data] usterki: [opis]. Do tej pory nie została naprawiona, a zgodnie z art. 6a ustawy o ochronie praw lokatorów naprawy tego typu obciążają wynajmującego. Proszę o ustalenie terminu naprawy w tym tygodniu. Dziękuję, [imię]",
  tr: {ru:"«Добрый день! Возвращаюсь к неисправности, о которой сообщал(а) [дата]: [описание]. До сих пор не починено, а согласно ст. 6a закона об охране прав жильцов ремонт такого типа — обязанность владельца. Прошу назначить срок ремонта на этой неделе. Спасибо, [имя]»",
       ua:"«Добрий день! Повертаюся до несправності, про яку повідомляв(ла) [дата]: [опис]. Досі не полагоджено, а згідно зі ст. 6a закону про охорону прав мешканців ремонт такого типу — обов'язок власника. Прошу призначити строк ремонту цього тижня. Дякую, [ім'я]»",
       by:"«Добры дзень! Вяртаюся да няспраўнасці, пра якую паведамляў(ла) [дата]: [апісанне]. Дагэтуль не адрамантавана, а паводле арт. 6a закона аб ахове правоў жыхароў рамонт такога тыпу — абавязак гаспадара. Прашу прызначыць тэрмін рамонту на гэтым тыдні. Дзякуй, [імя]»",
       en:"“Good afternoon! I'm following up on the fault reported on [date]: [description]. It still hasn't been fixed, and under art. 6a of the Tenant Protection Act repairs of this kind are the landlord's responsibility. Please set a repair date this week. Thank you, [name]”"} },
{ t: {ru:"Торг о цене", pl:"Negocjacja ceny", ua:"Торг про ціну", by:"Торг пра цану", en:"Negotiating the price"},
  n: {ru:"Работает лучше с аргументом: долгий срок, предоплата, готовность заехать сразу.", pl:"Działa lepiej z argumentem: dłuższy okres, szybka wprowadzka.", ua:"Працює краще з аргументом: довгий строк, передоплата, готовність заїхати одразу.", by:"Працуе лепш з аргументам: доўгі тэрмін, перадаплата, гатоўнасць заехаць адразу.", en:"Works best with an argument: long stay, quick move-in."},
  pl: "Dzień dobry! Mieszkanie bardzo mi się podoba i jestem gotowy/gotowa podpisać umowę na [12/24] miesięcy oraz wprowadzić się od zaraz. Czy przy dłuższej umowie byłaby możliwa cena [kwota] zł miesięcznie? Jestem sprawdzonym najemcą i mogę przedstawić referencje. Pozdrawiam, [imię]",
  tr: {ru:"«Добрый день! Квартира мне очень нравится, готов(а) подписать договор на [12/24] месяцев и заехать сразу. Возможна ли при долгом договоре цена [сумма] zł в месяц? Я проверенный арендатор и могу предоставить рекомендации. С уважением, [имя]»",
       ua:"«Добрий день! Квартира мені дуже подобається, готовий(а) підписати договір на [12/24] місяців і заїхати одразу. Чи можлива при довшому договорі ціна [сума] zł на місяць? Я перевірений орендар і можу надати рекомендації. З повагою, [ім'я]»",
       by:"«Добры дзень! Кватэра мне вельмі падабаецца, гатовы(а) падпісаць дамову на [12/24] месяцаў і заехаць адразу. Ці магчыма пры доўгай дамове цана [сума] zł у месяц? Я правераны арандатар і магу прадаставіць рэкамендацыі. З павагай, [імя]»",
       en:"“Good afternoon! I really like the flat and I'm ready to sign for [12/24] months and move in right away. Would [amount] zł per month be possible with a longer lease? I'm a reliable tenant and can provide references. Regards, [name]”"} },
{ t: {ru:"Уведомление о выезде", pl:"Wypowiedzenie umowy", ua:"Повідомлення про виїзд", by:"Паведамленне пра выезд", en:"Move-out notice"},
  n: {ru:"Отправьте письменно с соблюдением срока из договора; сохраните подтверждение.", pl:"Złóż pisemnie z zachowaniem okresu z umowy.", ua:"Надішліть письмово з дотриманням строку з договору; збережіть підтвердження.", by:"Адпраўце пісьмова з захаваннем тэрміну з дамовы; захавайце пацвярджэнне.", en:"Send in writing per your contract's notice period; keep proof."},
  pl: "Dzień dobry! Zgodnie z § [numer] umowy najmu z dnia [data umowy] niniejszym wypowiadam umowę najmu lokalu przy ul. [adres] z zachowaniem [1-miesięcznego] okresu wypowiedzenia, ze skutkiem na dzień [data]. Proszę o ustalenie terminu przekazania mieszkania i spisania protokołu. Pozdrawiam, [imię i nazwisko]",
  tr: {ru:"«Добрый день! Согласно § [номер] договора аренды от [дата договора] настоящим расторгаю договор аренды квартиры на ул. [адрес] с соблюдением [1-месячного] срока уведомления, с окончанием [дата]. Прошу назначить дату передачи квартиры и составления протокола. С уважением, [имя и фамилия]»",
       ua:"«Добрий день! Згідно з § [номер] договору оренди від [дата договору] цим розриваю договір оренди квартири на вул. [адреса] з дотриманням [1-місячного] строку повідомлення, з завершенням [дата]. Прошу призначити дату передачі квартири та складання протоколу. З повагою, [ім'я та прізвище]»",
       by:"«Добры дзень! Паводле § [нумар] дамовы арэнды ад [дата дамовы] гэтым разрываю дамову арэнды кватэры на вул. [адрас] з захаваннем [1-месячнага] тэрміну паведамлення, з завяршэннем [дата]. Прашу прызначыць дату перадачы кватэры і складання пратакола. З павагай, [імя і прозвішча]»",
       en:"“Good afternoon! Under § [number] of the lease dated [contract date] I hereby terminate the lease of the flat at [address], observing the [1-month] notice period, effective [date]. Please set a date for the handover and the protocol. Regards, [full name]”"} },
{ t: {ru:"Напоминание о кауции", pl:"Przypomnienie o kaucji", ua:"Нагадування про кауцію", by:"Напамін пра кауцыю", en:"Deposit reminder"},
  n: {ru:"Первый шаг перед официальной претензией — см. гайд «Как вернуть кауцию».", pl:"Pierwszy krok przed formalnym wezwaniem.", ua:"Перший крок перед офіційною претензією — див. гайд про кауцію.", by:"Першы крок перад афіцыйнай прэтэнзіяй — гл. гайд «Як вярнуць кауцыю».", en:"First step before a formal demand letter — see the deposit guide."},
  pl: "Dzień dobry! Mieszkanie przy ul. [adres] zostało zwrócone [data zwrotu] wraz z protokołem. Zgodnie z art. 6 ust. 4 ustawy o ochronie praw lokatorów kaucja podlega zwrotowi w ciągu miesiąca od opróżnienia lokalu. Proszę o zwrot kwoty [kwota] zł na konto [numer konta] w terminie 7 dni. W razie braku wpłaty będę zmuszony/zmuszona wystąpić z formalnym wezwaniem do zapłaty. Pozdrawiam, [imię i nazwisko]",
  tr: {ru:"«Добрый день! Квартира на ул. [адрес] была возвращена [дата возврата] вместе с протоколом. Согласно ст. 6 п. 4 закона об охране прав жильцов кауция подлежит возврату в течение месяца после освобождения квартиры. Прошу вернуть сумму [сумма] zł на счёт [номер счёта] в течение 7 дней. В случае отсутствия оплаты буду вынужден(а) направить официальную претензию (wezwanie do zapłaty). С уважением, [имя и фамилия]»",
       ua:"«Добрий день! Квартиру на вул. [адреса] було повернуто [дата повернення] разом із протоколом. Згідно зі ст. 6 п. 4 закону про охорону прав мешканців кауція підлягає поверненню протягом місяця після звільнення квартири. Прошу повернути суму [сума] zł на рахунок [номер рахунку] протягом 7 днів. У разі відсутності оплати буду змушений(а) надіслати офіційну претензію (wezwanie do zapłaty). З повагою, [ім'я та прізвище]»",
       by:"«Добры дзень! Кватэра на вул. [адрас] была вернута [дата вяртання] разам з пратаколам. Паводле арт. 6 п. 4 закона аб ахове правоў жыхароў кауцыя падлягае вяртанню на працягу месяца пасля вызвалення кватэры. Прашу вярнуць суму [сума] zł на рахунак [нумар рахунку] на працягу 7 дзён. У выпадку адсутнасці аплаты буду вымушаны(а) накіраваць афіцыйную прэтэнзію (wezwanie do zapłaty). З павагай, [імя і прозвішча]»",
       en:"“Good afternoon! The flat at [address] was returned on [return date] together with the protocol. Under art. 6(4) of the Tenant Protection Act the deposit must be returned within a month of vacating. Please refund [amount] zł to account [account number] within 7 days. Failing that I will have to send a formal demand letter (wezwanie do zapłaty). Regards, [full name]”"} }
];

var TR_LABEL = { ru: "Что говорится в сообщении", pl: "", ua: "Що сказано в повідомленні", by: "Што гаворыцца ў паведамленні", en: "What the message says" };

function render() {
  var L = I18N.lang;
  document.getElementById("sub").textContent = SUB[L] || SUB.ru;
  document.getElementById("foot").textContent = FOOT[L] || FOOT.ru;
  document.getElementById("list").innerHTML = PHRASES.map(function (p, i) {
    var note = p.n[L] || "";
    // дословный перевод польского текста на язык интерфейса (полякам не нужен)
    var tr = L !== "pl" && p.tr ? (p.tr[L] || p.tr.ru) : "";
    return '<div class="card gsec"><div class="h2">' + (p.t[L] || p.t.ru) + "</div>" +
      (note ? '<p class="gp" style="color:var(--hint)">' + note + "</p>" : "") +
      (tr ? '<div class="gtpl-label">' + TR_LABEL[L] + '</div><p class="gp" style="font-style:italic; color:var(--hint)">' + tr + "</p>" : "") +
      '<div class="gtpl"><pre>' + Guide.esc(p.pl) + "</pre>" +
      '<button class="btn sm" data-i="' + i + '"><span class="emi">' + Icons.svg("copy") +
      "</span> " + I18N.t("copyBtn") + "</button></div></div>";
  }).join("");
  document.querySelectorAll("[data-i]").forEach(function (b) {
    b.onclick = function () { Guide.copyText(PHRASES[+b.dataset.i].pl, b); };
  });
}

if (window.Icons) Icons.hydrate();
I18N.hydrate();
document.getElementById("ttl").textContent = I18N.t("cellPhrasesT");
document.title = I18N.t("cellPhrasesT") + " — Kwadrat PL";
render();
</script>
</body>
</html>
