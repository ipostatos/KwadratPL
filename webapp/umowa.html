  { h: "Растаржэнне (wypowiedzenie)", list: [

en: {
  sub: "What a Polish lease must contain, which clauses are red flags, and what all those Polish terms mean.",
  sections: [
  { h: "Types of lease", list: [
    "<b>Najem zwykły</b> (regular) — the standard. Strongest tenant protection: eviction only through court.",
    "<b>Najem okazjonalny</b> — individual landlord, up to 10 years. Requires the tenant's notarised declaration of voluntary eviction and a backup address. Not a trap — such landlords are often more organised.",
    "<b>Najem instytucjonalny</b> — same idea, but the landlord is a company." ] },
  { h: "What the contract must contain", list: [
    "Full details of both parties: names, PESEL/passport, addresses. Make sure the <b>owner</b> signs (or a power of attorney!).",
    "Exact address and description; furniture listed in the protocol annex.",
    "Term: fixed (na czas określony) or indefinite (nieokreślony).",
    "<b>Czynsz najmu</b> (rent to the owner) and separately: who pays czynsz administracyjny and utilities.",
    "Deposit: amount, return rules, deadline (one month by law).",
    "Handover protocol as an annex (załącznik).",
    "Termination rules (wypowiedzenie) for both sides." ] },
  { h: "Red flags 🚩", list: [
    "<b>A “no meldunek” clause</b> — residence registration is your legal right; the landlord's consent isn't required. The clause is void, but telling.",
    "Deposit above 2–3 months' rent — unusual, negotiate.",
    "“The landlord may terminate at any time” — a fixed-term lease can only be terminated for reasons written into it.",
    "Cash only with no receipts; refusing to show proof of ownership.",
    "Contractual penalties for everything: guests, one day's delay, “noise”.",
    "An obligation to “repaint on move-out” ignoring normal wear.",
    "“No contract needed, we trust each other” — without a contract you have no protection." ] },
  { h: "“Czynsz” is three different payments", list: [
    "<b>Czynsz najmu</b> — rent to the owner.",
    "<b>Czynsz administracyjny</b> — building fee to the housing community (often includes water, heating, rubbish).",
    "<b>Media</b> — electricity, gas, internet per meters.",
    "Listed prices often <i>exclude</i> the building fee and utilities — ask for the all-in amount and demand a yearly utilities reconciliation (rozliczenie)." ] },
  { h: "Termination (wypowiedzenie)", list: [
    "<b>Fixed term</b>: early termination only for reasons written in the contract (make sure you have some too!).",
    "<b>Indefinite</b>: notice periods per contract; a tenant who pays on time is strongly protected by law.",
    "Rent increases require a written notice (wypowiedzenie wysokości czynszu) at least 3 months ahead.",
    "Send your own move-out notice in writing and keep proof." ] },
  { h: "Meldunek (registration)", p: ["Residence registration is your right and formally a duty (stays >30 days). Done at the local office; the lease is enough. <b>It gives you no rights to the property</b> — reassure the landlord if needed. Foreigners need it for many procedures (PESEL, residence card)."] },

    "Compare price and terms with the listing: everything promised — in writing.",
    "Ask for proof of ownership: the księga wieczysta number can be checked free online (ekw.ms.gov.pl).",
    "Check the protocol and photograph the flat (see the deposit guide).",
    "Two copies, signatures on every page, one for you." ] },
  { h: "Glossary", list: [
    "<b>najemca</b> — tenant (you) · <b>wynajmujący</b> — landlord",
    "<b>kaucja</b> — deposit · <b>odstępne</b> — non-refundable “entry” fee (avoid)",
    "<b>protokół zdawczo-odbiorczy</b> — handover protocol",
    "<b>wypowiedzenie</b> — termination/notice · <b>okres wypowiedzenia</b> — notice period",
    "<b>księga wieczysta</b> — land register · <b>zameldowanie</b> — residence registration",
    "<b>kary umowne</b> — contractual penalties · <b>rozliczenie mediów</b> — utilities reconciliation" ] }
]}
