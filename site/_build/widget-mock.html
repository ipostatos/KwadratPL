<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  html,body{width:520px;height:420px;overflow:hidden}
  body{background:radial-gradient(120% 120% at 20% 0%, #3a5a74 0%, #24384a 45%, #16202c 100%);
    display:flex;align-items:center;justify-content:center}
  .w{width:360px;background:#17212b;border-radius:26px;padding:20px 22px;
    box-shadow:0 24px 60px rgba(0,0,0,.4);color:#e7edf3}
  .head{display:flex;align-items:center}
  .brand{color:#3aaee0;font-weight:800;font-size:17px;letter-spacing:.02em}
  .cnt{margin-left:auto;font-weight:800;font-size:30px;line-height:1}
  .sub{color:#93a4b4;font-size:12px;margin-top:3px}
  .rows{margin-top:16px;display:flex;flex-direction:column;gap:9px}
  .row{display:flex;align-items:center;font-size:14px}
  .row .p{font-weight:600}
  .row .d{margin-left:auto;color:#93a4b4}
  .foot{margin-top:16px;color:#93a4b4;font-size:11px;display:flex;align-items:center;gap:6px}
  .dot{width:6px;height:6px;border-radius:50%;background:#1f9d63;display:inline-block}
</style></head>
<body>
  <div class="w">
    <div class="head"><span class="brand">KWADRAT</span><span class="cnt">12</span></div>
    <div class="sub">подходящих · 5 новых за сутки</div>
    <div class="rows">
      <div class="row"><span class="p">2 900 zł</span><span class="d">Mokotów</span></div>
      <div class="row"><span class="p">3 100 zł</span><span class="d">Wola</span></div>
      <div class="row"><span class="p">3 250 zł</span><span class="d">Praga</span></div>
    </div>
    <div class="foot"><span class="dot"></span> обновлено 09:42 · нажмите, чтобы открыть</div>
  </div>
</body></html>
