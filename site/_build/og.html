<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<style>
  *{ margin:0; padding:0; box-sizing:border-box }
  html,body{ width:1200px; height:630px; overflow:hidden }
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:radial-gradient(1200px 700px at 80% -10%, #23394d 0%, #17212b 55%, #0e1621 100%);
    color:#e7edf3; padding:76px 84px; display:flex; flex-direction:column; justify-content:space-between;
  }
  .top{ display:flex; align-items:center; gap:20px }
  .mark{ width:96px; height:96px; border-radius:24px; display:flex; align-items:center; justify-content:center;
    background:linear-gradient(135deg,#2AABEE,#1b8ec2); box-shadow:0 12px 40px rgba(42,171,238,.35) }
  .mark svg{ width:58px; height:58px }
  .brand{ font-size:52px; font-weight:850; letter-spacing:-.02em }
  h1{ font-size:70px; font-weight:850; line-height:1.05; letter-spacing:-.03em; max-width:1000px }
  h1 .hl{ color:#54baea }
  .pills{ display:flex; gap:14px; margin-top:8px }
  .pill{ font-size:26px; font-weight:700; color:#cfe0ec; background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.12); padding:12px 24px; border-radius:999px }
  .foot{ display:flex; align-items:center; justify-content:space-between; font-size:30px; font-weight:700 }
  .foot .site{ color:#54baea }
  .foot .tg{ color:#93a4b4 }
</style>
</head>
<body>
  <div class="top">
    <div class="mark">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M6 22V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v18Z"/>
        <path d="M6 12H4a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h2"/>
        <path d="M18 9h2a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-2"/>
        <path d="M10 6h4"/><path d="M10 10h4"/><path d="M10 14h4"/><path d="M10 18h4"/>
      </svg>
    </div>
    <div class="brand">Kwadrat PL</div>
  </div>

  <h1>Аренда жилья в Польше <span class="hl">без посредников</span></h1>

  <div class="pills">
    <div class="pill">Бесплатно</div>
    <div class="pill">OLX · Otodom · Morizon</div>
    <div class="pill">AI-разбор</div>
    <div class="pill">Анти-скам</div>
  </div>

  <div class="foot">
    <span class="site">kwadratpl.pl</span>
    <span class="tg">@KwadratPLBot</span>
  </div>
</body>
</html>
